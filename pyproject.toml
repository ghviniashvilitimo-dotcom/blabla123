[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gold-backtest"
version = "0.1.0"
description = "Long-only gold (GLD) dual moving-average trend/momentum backtester"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "yfinance>=0.2.40",
  "click>=8.1.0",
  "tabulate>=0.9.0",
]

[project.scripts]
gold-backtest = "gold_backtest.cli:main"

[tool.setuptools.packages.find]
include = ["gold_backtest*"]
